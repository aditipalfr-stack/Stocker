    <meta name="theme-color" content="#030712" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('stocker-theme');
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#030712' : '#f1f5f9');
        } catch (error) {
          var fallbackTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = fallbackTheme;
          document.documentElement.style.colorScheme = fallbackTheme;
        }
      })();
    </script>
